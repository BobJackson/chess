# 中国象棋联机中继 —— chess.wangyousong.com
#
# 部署：
#   cp deploy/nginx/chess.wangyousong.com.conf /etc/nginx/conf.d/
#   nginx -t && nginx -s reload
#
# 前置：
#   1. 容器已起：docker compose up -d（chess-room 监听 127.0.0.1:8787）
#   2. mp 控制台「开发设置 → 服务器域名 → socket 合法域名」填 wss://chess.wangyousong.com
#   3. miniprogram/net/config.js 的 wsUrl 已指向 wss://chess.wangyousong.com/ws
#
# 说明：/ws 为 WebSocket 长连接，单独设置升级头与超长超时；
#       其余路径不对外提供内容，直接 404。

server {
    listen 80;
    server_name chess.wangyousong.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chess.wangyousong.com;

    access_log /var/log/nginx/chess.access.log;
    error_log  /var/log/nginx/chess.error.log;

    ssl_certificate     /etc/ssl/cert/fullchain.cer;
    ssl_certificate_key /etc/ssl/cert/*.wangyousong.com.key;
    # 微信要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:CHESS_SSL:10m;
    ssl_session_timeout 10m;

    ## to solve forward slowly
    proxy_http_version 1.1;

    # WebSocket 房间中继：升级头 + 长连接超时（对局可能持续数十分钟）
    location /ws {
        proxy_pass http://127.0.0.1:8787;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # 容器健康检查直通（room-server 根路径返回纯文本）
    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
    }

    location / {
        return 404;
    }
}
